
# Builds libmpv.so (both armeabi-v7a and arm64-v8a) using the official
# mpv-android build pipeline on GitHub's Linux runners.
#
# v2: hardened "Install build packages" — tolerates apt mirror hiccups, both
# spellings of pkg-config, PEP 668 (externally-managed pip), and runners
# without sudo. Diagnostics are printed so failures are self-explaining.

name: Build libmpv for rusttv

on:
  workflow_dispatch:
  push:

jobs:
  libmpv:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out mpv-android source
        uses: actions/checkout@v4
        with:
          repository: mpv-android/mpv-android
          ref: master

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Export build environment
        run: buildscripts/include/ci.sh export >> "$GITHUB_ENV"

      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install build packages (hardened)
        run: |
          set -x
          # Some runners ship without sudo (root user); some apt mirrors fail.
          SUDO=sudo; command -v sudo >/dev/null 2>&1 || SUDO=
          $SUDO apt-get update || echo "::warning::apt-get update failed, continuing with cached index"
          # 24.04 has pkg-config/pkgconf; older names may differ — try both.
          $SUDO apt-get install -y autoconf libtool ninja-build python3-pip gperf nasm pkg-config \
            || $SUDO apt-get install -y autoconf libtool ninja-build python3-pip gperf nasm pkgconfig
          # Ubuntu 24.04 marks system python as externally managed (PEP 668):
          # plain pip3 install refuses without --break-system-packages.
          $SUDO pip3 install meson \
            || $SUDO pip3 install --break-system-packages meson \
            || $SUDO apt-get install -y meson
          echo "--- tool availability ---"
          for t in meson ninja nasm pkg-config autoconf libtool gperf; do
            command -v "$t" >/dev/null 2>&1 && echo "OK   $t" || echo "MISS $t"
          done

      - name: Download or build dependencies
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build libmpv (both ABIs)
        run: buildscripts/include/ci.sh build

      - name: Collect libmpv libraries
        run: |
          find app/src/main/jniLibs -name '*.so' -exec ls -lh {} \; || true
          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a; do
            if [ -f "app/src/main/jniLibs/$abi/libmpv.so" ]; then
              mkdir -p "dist/$abi"
              cp "app/src/main/jniLibs/$abi/libmpv.so" "dist/$abi/"
            else
              echo "WARNING: libmpv.so not found for $abi" >&2
            fi
          done
          ls -lhR dist

      - name: Upload libmpv libraries
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-so
          path: dist/
          if-no-files-found: error

      # Backup: if the jniLibs path assumption above is ever wrong, the .so
      # can be extracted from these reference APKs instead.
      - name: Upload reference APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpv-android-reference-apks
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: ignore
